# CORNOD control-plane staging ONLY. No tenant command execution or Firecracker runtime.
# Put secrets in deploy/.env.staging (untracked) or your host secret manager.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      DATABASE_SSL: require
      PORT: "8080"
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
