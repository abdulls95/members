openapi: 3.1.0
info:
  title: CORNOD Control Plane API
  version: 1.0.0
  description: Implemented API foundation. Workspace creation records a queued request; no runtime worker is deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder; replace only after an approved backend is deployed.
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      summary: Process liveness
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      security: []
      summary: Database readiness
      responses:
        "200":
          description: Database connection is ready
        "503":
          description: Dependency unavailable
  /me:
    get:
      summary: Current identity and active tenant memberships
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentityEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tenants/{tenantId}/projects:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: List projects visible to the caller
      responses:
        "200":
          description: Visible project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tenant not found or not visible
  /tenants/{tenantId}/workspaces:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: List visible workspace metadata
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Workspace page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tenant not found or not visible
    post:
      summary: Queue a workspace request from an approved template
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "202":
          description: Workspace request accepted and queued; runtime is not yet provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRequestEnvelope"
        "200":
          description: Idempotent replay of the original request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRequestEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency key reused with a different request
        "429":
          description: Tenant resource quota reached
        "503":
          description: Tenant quota is not configured
  /tenants/{tenantId}/workspace-jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read the caller's workspace request job status
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceJobEnvelope"
        "404":
          description: Job not found or not visible to caller
  /tenants/{tenantId}/audit-events:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: Read tenant audit events
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Audit event page
        "403":
          $ref: "#/components/responses/Forbidden"
  /tenants/{tenantId}/usage:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      summary: Read tenant usage totals
      responses:
        "200":
          description: Usage totals
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
  responses:
    Unauthorized:
      description: Authentication required or access token invalid
    Forbidden:
      description: Access denied without disclosing cross-tenant object existence
    BadRequest:
      description: Invalid or unsupported request
  schemas:
    CurrentIdentityEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId:
          type: string
          format: uuid
        data:
          type: object
          required: [user, memberships]
          properties:
            user:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: [string, "null"]
                displayName:
                  type: [string, "null"]
            memberships:
              type: array
              items:
                type: object
                required: [tenantId, role]
                properties:
                  tenantId:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum: [TENANT_OWNER, TENANT_ADMIN, OPERATOR, DEVELOPER, AUDITOR]
                  joinedAt:
                    type: string
                    format: date-time
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [templateId, displayName, resourceProfile]
      properties:
        templateId:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        resourceProfile:
          type: string
          enum: [starter, standard]
        projectId:
          type: [string, "null"]
          format: uuid
    WorkspaceRequestEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId:
          type: string
          format: uuid
        data:
          type: object
          required: [replayed, workspace, job]
          properties:
            replayed:
              type: boolean
            workspace:
              type: object
              required: [id, displayName, state, templateId, resourceProfile, expiresAt]
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: string
                state:
                  type: string
                  const: REQUESTED
                templateId:
                  type: string
                resourceProfile:
                  type: string
                  enum: [starter, standard]
                expiresAt:
                  type: string
                  format: date-time
            job:
              type: object
              required: [id, state, action]
              properties:
                id:
                  type: string
                  format: uuid
                state:
                  type: string
                  const: QUEUED
                action:
                  type: string
                  const: CREATE
    WorkspaceJobEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId:
          type: string
          format: uuid
        data:
          type: object
          required: [job]
          properties:
            job:
              type: object
              required: [id, action, state, workspace_id, workspace_state]
              properties:
                id:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum: [CREATE, START, STOP, RESTART, DELETE]
                state:
                  type: string
                  enum: [QUEUED, LEASED, SUCCEEDED, FAILED, CANCELLED]
                workspace_id:
                  type: string
                  format: uuid
                workspace_state:
                  type: string
    ProjectListEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId:
          type: string
          format: uuid
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
    WorkspaceListEnvelope:
      type: object
      required: [data, requestId]
      properties:
        requestId:
          type: string
          format: uuid
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, display_name, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  project_id:
                    type: [string, "null"]
                    format: uuid
                  template_id:
                    type: string
                  display_name:
                    type: string
                  state:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
            nextCursor:
              type: [string, "null"]
