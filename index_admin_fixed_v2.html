<style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL="https://ovzjhaykcrtvyoxneydc.supabase.co";
const SUPABASE_KEY="sb_publishable_t6rvrM-OF5_S4lnxsa6HEQ_tTl_Gzeo";
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const M=v=>Number(v||0).toLocaleString("en-US",{maximumFractionDigits:2}),H=v=>Math.round(Number(v||0)*100),F=h=>M(h/100);
const STAFF=["ADMIN","MANAGER","ACCOUNTANT","VIEWER"],FR={FULL:"دفعة كاملة",MONTHLY:"شهري",QUARTERLY:"ربع سنوي",SEMIANNUAL:"نصف سنوي",ANNUAL:"سنوي"};
const ST={PENDING:"بانتظار الموافقة",ACTIVE:"فعّال",REJECTED:"مرفوض",CHANGES_REQUESTED:"مطلوب تعديل",SUSPENDED:"موقوف"};

const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.join("")||`<tr><td colspan="${h.length}">لا توجد بيانات</td></tr>`}</table></div>`;
const canP=()=>["ADMIN","MANAGER"].includes(prof?.role),canPay=()=>["ADMIN","MANAGER","ACCOUNTANT"].includes(prof?.role),isAdm=()=>prof?.role==="ADMIN";

async function diag(){const o=["page origin: "+location.origin,"supabase client: "+(sb?"created":"NOT created"),"SUPABASE_URL: "+SUPABASE_URL,"key prefix: "+SUPABASE_KEY.slice(0,18)+"..."];

 try{const r=await fetch(SUPABASE_URL+"/auth/v1/health",{headers:{apikey:SUPABASE_KEY}});o.push("health check: HTTP "+r.status+" "+(await r.text()).slice(0,200))}catch(e){o.push("health check FAILED: "+e.name+": "+e.message)}
 $("#dg").textContent=o.join("\n")}
// ---------- الدخول والتسجيل ----------
function authV(mode){
 const t={in:"تسجيل الدخول",forgot:"استعادة كلمة المرور"}[mode];
 app.innerHTML=`<div class="box card"><h2>مجموعة آل عامر شجاع</h2><h2>${t}</h2><div class="f"><div><label>البريد الإلكتروني</label><input id="e" type="email" autocomplete="username"></div>
 ${mode==="in"?`<div><label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password"></div>`:""}</div>
 <button id="go">${mode==="in"?"دخول":"إرسال رابط الاستعادة"}</button><p id="msg"></p>
 <p class="mu">${mode==="in"?`<button type="button" class="lk" id="l1">نسيت كلمة المرور؟</button> | <button type="button" class="lk" id="l2">تسجيل مساهم جديد</button>`:`<button type="button" class="lk" id="l1">رجوع</button>`}</p>${DG}</div>`;
 $("#dgb").onclick=diag;
 $("#l1").onclick=()=>authV(mode==="in"?"forgot":"in");if($("#l2"))$("#l2").onclick=()=>regV();
 $("#go").onclick=async()=>{const em=$("#e").value.trim();if(!em)return msg("اكتب البريد",1);$("#go").disabled=true;
  if(mode==="in"){const{error}=await sb.auth.signInWithPassword({email:em,password:$("#p").value});if(error){$("#go").disabled=false;return msg("بيانات الدخول غير صحيحة أو الحساب غير مؤكد",1)}route()}
  else{const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$("#go").disabled=false;msg(error?"تعذر الإرسال":"إذا كان البريد مسجلًا ستصلك رسالة",!!error)}}}
function regV(){
 app.innerHTML=`<div class="box card" style="max-width:640px"><h2>تسجيل مساهم جديد</h2><form id="rf"><div class="f">
 <div><label>الاسم الكامل</label><input name="n" required></div><div><label>رقم الهوية</label><input name="i" required></div><div><label>الهاتف</label><input name="p" required></div>
 <div><label>المدينة</label><input name="c"></div><div><label>عدد الأسهم (10 ريال للسهم)</label><input name="s" type="number" min="1" step="1" required></div>
 <div><label>خطة السداد</label><select name="f">${Object.entries(FR).map(([k,v])=>`<option value="${k}" ${k==="MONTHLY"?"selected":""}>${v}</option>`).join("")}</select></div>
 <div><label>البريد الإلكتروني</label><input name="e" type="email" required></div><div><label>كلمة المرور (8 أحرف فأكثر)</label><input name="w" type="password" minlength="8" required></div></div>
 <label><input type="checkbox" name="m" style="width:auto"> المساهم قاصر</label><div class="f"><div><label>اسم الولي</label><input name="gn"></div><div><label>هوية الولي</label><input name="gi"></div><div><label>هاتف الولي</label><input name="gp"></div><div><label>صلة الولي</label><input name="gr"></div></div>
 <label class="mu"><input type="checkbox" name="a" required style="width:auto"> أقر بأن هذه مساهمة تجارية ذات حقوق ومخاطر وليست تبرعًا ولا عائدًا مضمونًا.</label><br><br>
 <button id="go">إرسال الطلب</button> <button type="button" class="g" id="bk">رجوع</button><p id="msg"></p>${DG}</form></div>`;
 $("#dgb").onclick=diag;
 $("#bk").onclick=()=>authV("in");
 $("#rf").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,mi=f.m.checked;
  if(mi&&!f.gn.value.trim())return msg("اسم الولي مطلوب للقاصر",1);
  const reg={full_name:f.n.value.trim(),id_number:f.i.value.trim(),phone:f.p.value.trim(),city:f.c.value.trim(),is_minor:mi,guardian_name:f.gn.value.trim(),guardian_id:f.gi.value.trim(),guardian_phone:f.gp.value.trim(),guardian_relation:f.gr.value.trim(),shares:String(parseInt(f.s.value)||0),frequency:f.f.value};
  $("#go").disabled=true;let error;try{({error}=await sb.auth.signUp({email:f.e.value.trim(),password:f.w.value,options:{data:{full_name:reg.full_name,reg},emailRedirectTo:location.origin+location.pathname}}))}catch(x){error=x}
  if(error){$("#go").disabled=false;return msg("الخطأ الفعلي: "+errText(error)+(/database/i.test(error.message)?"\nالسبب المحتمل: رقم الهوية أو الهاتف مسجل مسبقًا أو خطأ في المشغّل":""),1)}
  app.innerHTML=`<div class="box card"><h2>تم استلام طلبك</h2><p>حالة الطلب: <b>بانتظار موافقة الإدارة</b>. إذا وصلتك رسالة تأكيد على بريدك فافتح الرابط فيها، ثم سجّل الدخول.</p><button id="b">تسجيل الدخول</button></div>`;$("#b").onclick=()=>authV("in")}}
function resetV(){
 app.innerHTML=`<div class="box card"><h2>كلمة مرور جديدة</h2><div class="f"><div><label>كلمة المرور الجديدة</label><input id="p" type="password" minlength="8"></div></div><button id="go">حفظ</button><p id="msg"></p></div>`;
 $("#go").onclick=async()=>{const p=$("#p").value;if(p.length<8)return msg("8 أحرف على الأقل",1);const{error}=await sb.auth.updateUser({password:p});if(error)return msg("تعذر الحفظ",1);recovery=false;route()}}
async function route(){
 if(!sb)return app.innerHTML=`<div class="box bad">تعذر تحميل مكتبة Supabase من الإنترنت. تأكد من الاتصال أو من عدم وجود مانع إعلانات، ثم حدّث الصفحة.</div>`;
 if(recovery)return resetV();

 const{data:{session},error:sessionError}=await sb.auth.getSession();
 if(sessionError)return app.innerHTML=`<div class="box bad">تعذر قراءة جلسة الدخول: ${esc(sessionError.message)}</div>`;
 if(!session)return location.hash==="#/register"?regV():authV("in");

 // Get the role securely from the database. This does not depend on reading
 // the profiles table through the browser's SELECT policy.
 const{data:secureRole,error:roleError}=await sb.rpc("my_role");
 if(roleError){
   app.innerHTML=`<div class="box bad">
     <h2>تعذر التحقق من صلاحية الحساب</h2>
     <p>تم تسجيل الدخول، لكن التطبيق لم يستطع التحقق من دور الحساب.</p>
     <pre id="roleErr" style="white-space:pre-wrap;direction:ltr;text-align:left">${esc(roleError.message)}${roleError.code?`\ncode=${esc(roleError.code)}`:""}</pre>
     <button class="g" id="retry">إعادة المحاولة</button>
     <button class="g" id="logout2">خروج</button>
   </div>`;
   $("#retry").onclick=()=>route();
   $("#logout2").onclick=async()=>{await sb.auth.signOut();prof=null;authV("in")};
   return;
 }

 // The profile is useful for the display name, but failure to read it must
 // not downgrade an authenticated ADMIN to SHAREHOLDER.
 const{data:p,error:profileError}=await sb.from("profiles").select("*").eq("user_id",session.user.id).maybeSingle();

 if(profileError && !secureRole){
   app.innerHTML=`<div class="box bad">
     <h2>تعذر قراءة بيانات الحساب</h2>
     <p>تم تسجيل الدخول، لكن لم يمكن قراءة سجل الملف الشخصي.</p>
     <pre style="white-space:pre-wrap;direction:ltr;text-align:left">${esc(profileError.message)}${profileError.code?`\ncode=${esc(profileError.code)}`:""}</pre>
     <button class="g" id="retry">إعادة المحاولة</button>
     <button class="g" id="logout2">خروج</button>
   </div>`;
   $("#retry").onclick=()=>route();
   $("#logout2").onclick=async()=>{await sb.auth.signOut();prof=null;authV("in")};
   return;
 }

 const role=secureRole||p?.role;
 if(!role){
   app.innerHTML=`<div class="box bad">
     <h2>لم يتم العثور على صلاحية للحساب</h2>
     <p>تم تسجيل الدخول بنجاح، لكن لا يوجد دور صالح مرتبط بهذا الحساب.</p>
     <button class="g" id="retry">إعادة المحاولة</button>
     <button class="g" id="logout2">خروج</button>
   </div>`;
   $("#retry").onclick=()=>route();
   $("#logout2").onclick=async()=>{await sb.auth.signOut();prof=null;authV("in")};
   return;
 }

 prof={...(p||{}),role,full_name:p?.full_name||session.user.email};
 app.innerHTML=`<div class="top box"><div><b>${esc(prof.full_name||session.user.email)}</b> <span class="mu">(${esc(prof.role)})</span></div><div><button class="g" id="cp">تغيير كلمة المرور</button> <button class="g" id="lo">خروج</button></div></div><div id="c"></div>`;
 $("#lo").onclick=async()=>{await sb.auth.signOut();prof=null;authV("in")};
 $("#cp").onclick=()=>{recovery=true;resetV()};
 STAFF.includes(prof.role)?staffV():shV()}
// ---------- لوحة المساهم (بياناته فقط بحماية RLS) ----------
async function shV(){
 const c=$("#c"),{data:s}=await sb.from("shareholders").select("*").maybeSingle();
 if(!s)return c.innerHTML=`<div class="box">لا يوجد سجل مساهم مرتبط بحسابك. تواصل مع الإدارة.</div>`;
 const[{data:sm},{data:sc},{data:py}]=await Promise.all([sb.from("v_commitment_summary").select("*").eq("shareholder_id",s.id),sb.from("v_schedule").select("*").order("seq"),sb.from("payments").select("*").eq("shareholder_id",s.id).order("created_at",{ascending:false})]);
 const m=(sm||[])[0]||{},nx=(sc||[]).find(x=>x.state!=="PAID"),per=(sc||[])[0]?.amount_due;
 const card=(b,t)=>`<div class="box st"><b>${b}</b><span>${t}</span></div>`;
 c.innerHTML=`<h2>مرحبًا ${esc(s.full_name)}</h2><div class="mu">رقم المساهم: <b>${esc(s.member_no)}</b> | الحالة: <b>${ST[s.status]}</b> ${s.notes&&s.status==="CHANGES_REQUESTED"?"| ملاحظة الإدارة: "+esc(s.notes):""}</div>
 <div class="grid">${card(m.shares??0,"الأسهم الملتزم بها")}${card(M(m.total),"قيمة الالتزام (ر.س)")}${card(M(m.paid),"المدفوع المعتمد")}${card(M(m.remaining),"المتبقي")}
 ${card((m.pct??0)+"%","نسبة السداد")}${card(m.paid_shares??0,"الأسهم المدفوعة")}${card(Math.max(0,(m.shares||0)-(m.paid_shares||0)),"الأسهم المتبقية")}${card(nx?M(nx.remaining)+" ("+nx.due_date+")":"-","الدفعة القادمة")}</div>
 <div class="mu">القسط: ${per!=null?M(per):"-"} ر.س. الدفعات تدخل الحساب بعد اعتماد الإدارة فقط.</div>
 ${s.status==="ACTIVE"?`<div class="box"><h2>تسجيل دفعة</h2><form id="pf"><div class="f"><div><label>المبلغ (ر.س)</label><input name="amt" type="number" step="0.01" min="0.01" required></div><div><label>تاريخ التحويل</label><input name="dt" type="date" value="${today()}" required></div>
 <div><label>طريقة الدفع</label><input name="mt"></div><div><label>مرجع التحويل</label><input name="rf"></div><div><label>الإيصال (صورة أو PDF)</label><input name="file" type="file" accept="image/*,application/pdf"></div></div><button id="pb">إرسال للتحقق</button><span id="msg"></span></form></div>`:`<div class="box mu">تسجيل الدفعات يفتح بعد موافقة الإدارة على طلبك.</div>`}
 <div class="box"><h2>جدول السداد</h2>${tbl(["#","الاستحقاق","المطلوب","المدفوع","المتبقي","الحالة"],(sc||[]).map(x=>`<tr><td>${x.seq}</td><td>${x.due_date}</td><td>${M(x.amount_due)}</td><td>${M(x.amount_paid)}</td><td>${M(x.remaining)}</td><td class="${x.state==="LATE"?"bad":""}">${SS[x.state]}</td></tr>`))}</div>
 <div class="box"><h2>دفعاتي</h2>${tbl(["التاريخ","المبلغ","المرجع","الحالة"],(py||[]).map(x=>`<tr><td>${x.paid_on}</td><td>${M(x.amount)}</td><td>${esc(x.reference||"")}</td><td>${PS[x.status]}</td></tr>`))}</div>`;
 if($("#pf"))$("#pf").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,amt=Number(f.amt.value);if(!(amt>0)||!m.commitment_id)return msg("أدخل مبلغًا صحيحًا",1);
  $("#pb").disabled=true;let path=null;const file=f.file.files[0];
  if(file){if(file.size>5e6||!/^(image\/|application\/pdf)/.test(file.type)){$("#pb").disabled=false;return msg("الإيصال: صورة أو PDF حتى 5MB",1)}
   path=`${s.id}/${crypto.randomUUID()}.${(file.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").slice(0,5)}`;
   const u=await sb.storage.from("receipts").upload(path,file,{contentType:file.type});if(u.error){$("#pb").disabled=false;return msg("تعذر رفع الإيصال",1)}}
  const r=await sb.from("payments").insert({shareholder_id:s.id,commitment_id:m.commitment_id,amount:amt,paid_on:f.dt.value,method:f.mt.value,reference:f.rf.value,receipt_path:path,idempotency_key:crypto.randomUUID()});
  if(r.error){$("#pb").disabled=false;return msg("تعذر الحفظ",1)}shV()}}
// ---------- لوحة الإدارة ----------
const TB={ov:"نظرة عامة",rq:"طلبات التسجيل",sh:"المساهمون",py:"الدفعات",st:"الإعدادات",au:"سجل التدقيق"};
function staffV(){const c=$("#c");const tabs=Object.entries(TB).filter(([k])=>!["st","au"].includes(k)||isAdm());
 c.innerHTML=`<nav>${tabs.map(([k,v])=>`<button class="${tab===k?"on":"g"}" data-t="${k}">${v}</button>`).join("")}</nav><div id="t"></div>`;
 c.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;staffV()});
 ({ov,rq,sh,py,st,au}[tab]||ov)($("#t"))}
async function ov(t){
 const[a,b,d,e]=await Promise.all([sb.from("v_commitment_summary").select("shares,total,paid,remaining,paid_shares"),sb.from("shareholders").select("status"),sb.from("v_schedule").select("commitment_id,due_date,amount_due,remaining,state"),sb.from("payments").select("status,amount,paid_on")]);
 const sum=(r,k)=>(r||[]).reduce((x,y)=>x+H(y[k]),0),mo=today().slice(0,7),A=a.data||[],D=d.data||[],E=e.data||[];
 const exp=D.filter(x=>x.due_date.startsWith(mo)).reduce((x,y)=>x+H(y.amount_due),0),act=E.filter(x=>x.status==="APPROVED"&&x.paid_on.startsWith(mo)).reduce((x,y)=>x+H(y.amount),0);
 const late=D.filter(x=>x.state==="LATE"),ps=A.reduce((x,y)=>x+(y.paid_shares||0),0),ts=A.reduce((x,y)=>x+(y.shares||0),0);
 const cd=(x,y)=>`<div class="box st"><b>${x}</b><span>${y}</span></div>`,B=b.data||[];
 t.innerHTML=`<div class="grid">${cd(B.length,"إجمالي المساهمين")}${cd(B.filter(x=>x.status==="ACTIVE").length,"فعّالون")}${cd(B.filter(x=>x.status==="PENDING").length,"طلبات بانتظار الموافقة")}${cd(E.filter(x=>x.status==="PENDING").length,"دفعات بانتظار التحقق")}

async function setSh(id,status){let note;if(status==="CHANGES_REQUESTED"){note=prompt("ما التعديل المطلوب؟");if(!note)return}
 const r=await sb.from("shareholders").update(note?{status,notes:note}:{status}).eq("id",id);if(r.error)alert("تعذر التنفيذ (الصلاحية؟)");staffV()}
async function rq(t){
 const{data}=await sb.from("shareholders").select("*,commitments(shares,total,frequency)").in("status",["PENDING","CHANGES_REQUESTED"]).order("created_at");
 t.innerHTML=`<div class="box"><h2>طلبات التسجيل</h2>${tbl(["الاسم","الهاتف","الهوية","الأسهم","الالتزام","التاريخ","إجراء"],(data||[]).map(s=>{const c=s.commitments?.[0]||{};
  return `<tr><td>${esc(s.full_name)}</td><td>${esc(s.phone)}</td><td>${esc(s.id_number)}</td><td>${c.shares??"-"}</td><td>${M(c.total)}</td><td>${s.created_at.slice(0,10)}</td><td>${canP()?`<button data-a="ACTIVE" data-i="${s.id}">موافقة</button> <button class="g" data-a="REJECTED" data-i="${s.id}">رفض</button> <button class="g" data-a="CHANGES_REQUESTED" data-i="${s.id}">طلب تعديل</button>`:"-"}</td></tr>`}))}</div>`;
 t.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>setSh(b.dataset.i,b.dataset.a))}
async function sh(t){
 const[a,b]=await Promise.all([sb.from("shareholders").select("*").order("created_at",{ascending:false}),sb.from("v_commitment_summary").select("*")]);
 const mp={};(b.data||[]).forEach(x=>mp[x.shareholder_id]=x);
 t.innerHTML=`<div class="box"><h2>جميع المساهمين</h2><input id="q" placeholder="بحث بالاسم أو الرقم أو الهاتف أو الهوية"><div id="tt"></div></div>`;
 const draw=()=>{const q=$("#q").value.trim();$("#tt").innerHTML=tbl(["رقم","الاسم","الهاتف","الهوية","الحالة","الأسهم","الالتزام","المدفوع","المتبقي","%"],(a.data||[]).filter(s=>!q||[s.full_name,s.member_no,s.phone,s.id_number].some(v=>(v||"").includes(q))).map(s=>{const m=mp[s.id]||{};
  return `<tr><td>${s.member_no}</td><td>${esc(s.full_name)}</td><td>${esc(s.phone)}</td><td>${isAdm()?esc(s.id_number):"****"+esc((s.id_number||"").slice(-4))}</td><td>${ST[s.status]}</td><td>${m.shares??"-"}</td><td>${M(m.total)}</td><td>${M(m.paid)}</td><td>${M(m.remaining)}</td><td>${m.pct??0}</td></tr>`}))};
 draw();$("#q").oninput=draw}
async function py(t){
 const[a,b]=await Promise.all([sb.from("payments").select("*,shareholders(full_name,member_no)").order("created_at",{ascending:false}).limit(200),sb.from("v_commitment_summary").select("commitment_id,shareholder_id,shareholders(full_name,member_no)")]);
 t.innerHTML=`${canPay()?`<div class="box"><h2>إضافة دفعة معتمدة</h2><form id="af"><div class="f"><div><label>المساهم</label><select name="c" required><option value="">اختر</option>${(b.data||[]).map(x=>`<option value="${x.commitment_id}" data-s="${x.shareholder_id}">${esc(x.shareholders?.full_name)} ${x.shareholders?.member_no}</option>`).join("")}</select></div>
 <div><label>المبلغ</label><input name="amt" type="number" step="0.01" min="0.01" required></div><div><label>التاريخ</label><input name="dt" type="date" value="${today()}"></div><div><label>الطريقة</label><input name="mt"></div><div><label>المرجع</label><input name="rf"></div></div><button>حفظ</button> <span id="msg"></span></form></div>`:""}
 <div class="box"><h2>الدفعات</h2>${tbl(["التاريخ","المساهم","المبلغ","المرجع","الحالة","إجراء"],(a.data||[]).map(p=>`<tr><td>${p.paid_on}</td><td>${esc(p.shareholders?.full_name)} ${p.shareholders?.member_no||""}</td><td>${M(p.amount)}</td><td>${esc(p.reference||"")}</td><td>${PS[p.status]}${p.void_reason?" ("+esc(p.void_reason)+")":""}</td>
 <td>${p.receipt_path?`<button class="g" data-r="${esc(p.receipt_path)}">الإيصال</button> `:""}${canPay()&&p.status==="PENDING"?`<button data-p="${p.id}" data-s="APPROVED">اعتماد</button> <button class="g" data-p="${p.id}" data-s="REJECTED">رفض</button>`:""}${canPay()&&p.status==="APPROVED"?`<button class="g" data-p="${p.id}" data-s="VOID">إلغاء</button>`:""}</td></tr>`))}</div>`;
 t.querySelectorAll("[data-p]").forEach(x=>x.onclick=async()=>{const up={status:x.dataset.s};if(up.status==="VOID"){const r=prompt("سبب الإلغاء؟");if(!r)return;up.void_reason=r}
  const r=await sb.from("payments").update(up).eq("id",x.dataset.p);if(r.error)alert("تعذر التنفيذ");staffV()});
 t.querySelectorAll("[data-r]").forEach(x=>x.onclick=async()=>{const{data}=await sb.storage.from("receipts").createSignedUrl(x.dataset.r,300);if(data)x.outerHTML=`<a href="${data.signedUrl}" target="_blank" rel="noopener">فتح الإيصال</a>`});
 if($("#af"))$("#af").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,o=f.c.selectedOptions[0];
  const r=await sb.from("payments").insert({shareholder_id:o.dataset.s,commitment_id:f.c.value,amount:Number(f.amt.value),paid_on:f.dt.value,method:f.mt.value,reference:f.rf.value,status:"APPROVED",idempotency_key:crypto.randomUUID()});
  if(r.error)return msg("تعذر الحفظ",1);staffV()}}
