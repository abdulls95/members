# Publishes ONLY the site/ folder to GitHub Pages.
# Manual trigger only: merging to main does NOT publish. The owner launches from Actions → "Deploy CORNOD to Pages" → Run workflow.
name: Deploy CORNOD to Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish publicly'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
