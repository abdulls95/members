name: CORNOD quality checks
on:
  push:
    branches: ["cornod-build"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static frontend and security guardrails
        run: node scripts/validate.mjs
