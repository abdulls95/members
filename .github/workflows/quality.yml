name: CORNOD quality checks
on:
  push:
    branches: ["main", "cornod-build", "cornod/industrial-ui-refresh"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in $(find assets/js -type f -name "*.js"); do node --check "$file"; done
      - name: Test UI modules and terminal safety
        run: node --test tests/unit/*.test.mjs
      - name: Validate frontend, navigation and security guardrails
        run: node scripts/validate.mjs
      - name: Build pinned Sherlock tool payload
        run: docker build --pull --tag cornod-sherlock:ci infra/tools/sherlock
      - name: Verify Sherlock payload runs unprivileged
        run: test "$(docker image inspect --format='{{.Config.User}}' cornod-sherlock:ci)" = "10001:10001"
      - name: Smoke-test Sherlock payload offline
        run: |
          docker run --rm --network none --entrypoint sherlock cornod-sherlock:ci --version
          docker run --rm --network none cornod-sherlock:ci --help
