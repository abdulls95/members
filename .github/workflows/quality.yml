name: CORNOD quality checks
on:
  push:
    branches: ["main", "cornod-build"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Validate frontend, navigation and security guardrails
        run: node scripts/validate.mjs
