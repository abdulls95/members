name: CORNOD quality checks
on:
  push:
    branches: ["main", "cornod-build", "cornod/industrial-ui-refresh"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in $(find assets/js -type f -name "*.js"); do node --check "$file"; done
      - name: Test UI modules and terminal safety
        run: node --test tests/unit/*.test.mjs
      - name: Validate frontend, navigation and security guardrails
        run: node scripts/validate.mjs
