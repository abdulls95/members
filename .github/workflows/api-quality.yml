name: CORNOD API quality checks
on:
  push:
    branches: ["cornod/api-service-foundation"]
    paths:
      - "server/**"
      - "package.json"
      - ".github/workflows/api-quality.yml"
      - "Dockerfile"
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - "package.json"
      - ".github/workflows/api-quality.yml"
      - "Dockerfile"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check API syntax
        run: npm run check
      - name: Run API unit and boundary tests
        run: npm test
