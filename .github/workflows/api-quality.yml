name: CORNOD API quality checks
on:
  push:
    branches: ["cornod/api-service-foundation", "cornod/project-scope-hardening", "cornod/security-pipeline", "cornod/workspace-queue-foundation", "cornod/workspace-queue-release"]
    paths:
      - "server/**"
      - "db/**"
      - "package.json"
      - ".github/workflows/api-quality.yml"
      - "Dockerfile"
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - "db/**"
      - "package.json"
      - ".github/workflows/api-quality.yml"
      - "Dockerfile"
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cornod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cornod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Provision restricted runtime role
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d cornod_test -v ON_ERROR_STOP=1 -c "CREATE ROLE cornod_app LOGIN PASSWORD 'test-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
      - name: Provision isolated runtime worker role
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d cornod_test -v ON_ERROR_STOP=1 -c "CREATE ROLE cornod_worker NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
      - name: Apply schema migrations
        env:
          PGPASSWORD: test-only-password
        run: for migration in db/migrations/*.sql; do psql -h localhost -U postgres -d cornod_test -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Seed API integration fixtures
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d cornod_test -v ON_ERROR_STOP=1 -f db/tests/api-seed.sql
      - name: Check API syntax
        run: npm run check
      - name: Run unit, HTTP and PostgreSQL integration tests
        env:
          API_TEST_DATABASE_URL: postgresql://cornod_app:test-only-password@127.0.0.1:5432/cornod_test
        run: npm test
      - name: Generate CycloneDX dependency SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cornod-api-sbom
          path: sbom.cdx.json
          retention-days: 30
      - name: Build API container image
        run: docker build --pull --tag cornod-api:ci .
      - name: Verify container runs as non-root
        run: test "$(docker image inspect --format='{{.Config.User}}' cornod-api:ci)" = "node"
      - name: Boot container and verify health endpoints
        env:
          TEST_DATABASE_URL: postgresql://cornod_app:test-only-password@127.0.0.1:5432/cornod_test
        run: |
          docker run --detach --network host --name cornod-api-ci \
            --env NODE_ENV=test \
            --env PORT=8080 \
            --env DATABASE_URL="$TEST_DATABASE_URL" \
            --env DATABASE_SSL=disable \
            --env OIDC_ISSUER=https://identity.example.invalid \
            --env OIDC_AUDIENCE=cornod-api \
            --env OIDC_JWKS_URL=https://identity.example.invalid/.well-known/jwks.json \
            --env OIDC_REQUIRED_SCOPE=cornod:api \
            --env CORS_ORIGINS=https://app.cornod.invalid \
            cornod-api:ci
          trap 'docker rm --force cornod-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health/live
          curl --fail --silent http://127.0.0.1:8080/health/ready
